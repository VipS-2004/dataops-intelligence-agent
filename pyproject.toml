authors = [
    { name = "VipS-2004", email = "vipanshusingh91@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "gradio>=6.31.0",
    "langchain-core>=1.7.6",
    "langchain-openai>=1.7.4",
    "langgraph>=1.2.20",
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
